services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      APP_NAME: AI CareerPilot
      DATABASE_URL: sqlite:////app/data/careerpilot.db
      SECRET_KEY: ${SECRET_KEY:-replace-with-a-long-random-secret-key-at-least-32-characters}
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      UPLOADS_DIR: /app/uploads
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      CORS_ALLOW_ORIGINS: http://localhost:5173,http://localhost:8080
    volumes:
      - backend_data:/app/data
      - backend_uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  backend_data:
  backend_uploads:

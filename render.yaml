databases:
  - name: careerpilot-db
    databaseName: careerpilot
    plan: free

services:
  - type: web
    name: careerpilot-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health

    envVars:
      - key: APP_NAME
        value: AI CareerPilot

      - key: DATABASE_URL
        fromDatabase:
          name: careerpilot-db
          property: connectionString

      - key: SECRET_KEY
        generateValue: true

      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"

      - key: UPLOADS_DIR
        value: /app/uploads

      - key: CORS_ALLOW_ORIGINS
        value: https://careerpilot-frontend-pmf6.onrender.com

      - key: LLM_API_KEY
        sync: false

      - key: LLM_BASE_URL
        value: https://api.openai.com/v1

      - key: LLM_MODEL
        value: gpt-4o-mini

  - type: web
    name: careerpilot-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist

    envVars:
      - key: VITE_API_BASE_URL
        value: https://careerpilot-backend-ktgw.onrender.com/api

    routes:
      - type: rewrite
        source: /*
        destination: /index.html